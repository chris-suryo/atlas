<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — Log (keypad / entry mode) reference</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap">
<style>
:root{
  --color-bg:#131110; --color-text:#ECE5D9; --color-text-muted:#948A7C;
  --color-text-faint:#5C554B; --color-line:rgba(236,229,217,.09); --color-accent:#D2924A;
  --color-accent-ink:#2A1C08; --radius-control:12px;
  --font-display:"Space Grotesk",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;font-family:var(--font-display);font-feature-settings:"tnum" 1}
body{background:#0b0b0b;display:flex;justify-content:center;padding:20px;min-height:100vh}
.dia{width:7px;height:7px;background:var(--color-accent);transform:rotate(45deg);flex:none}
.num{font-size:38px;font-weight:500;letter-spacing:-.5px;cursor:pointer;color:var(--color-text)}
.num.on{color:var(--color-accent)}
.key{display:flex;align-items:center;justify-content:center;height:52px;font-size:23px;color:var(--color-text);cursor:pointer;border-radius:12px;user-select:none}
.key:active{background:rgba(236,229,217,.06)}
</style>
</head>
<body>
<div style="width:100%;max-width:360px;background:#000;border-radius:52px;padding:4px">
<div style="position:relative;height:764px;background:var(--color-bg);border-radius:48px;overflow:hidden;display:flex;flex-direction:column;color:var(--color-text)">

<div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:92px;height:27px;background:#000;border-radius:16px;z-index:2"></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:15px 30px 0;font-size:14px;font-weight:500">
<span>9:41</span>
<span style="display:flex;align-items:center;gap:7px">
<span style="display:flex;align-items:flex-end;gap:2px;height:11px"><span style="width:3px;height:4px;background:var(--color-text);border-radius:1px"></span><span style="width:3px;height:6px;background:var(--color-text);border-radius:1px"></span><span style="width:3px;height:8px;background:var(--color-text);border-radius:1px"></span><span style="width:3px;height:11px;background:var(--color-text);border-radius:1px"></span></span>
<span style="display:inline-block;width:23px;height:12px;border:1px solid var(--color-text-muted);border-radius:3px;position:relative"><span style="position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:16px;background:var(--color-text);border-radius:1px"></span></span>
</span>
</div>

<div style="padding:26px 28px 0;display:flex;justify-content:space-between;align-items:baseline">
<span style="font-size:12px;color:var(--color-text-muted)">Push · Mon 30 <span style="color:var(--color-text-faint)">·  18:24</span></span>
<span style="font-size:12px;color:var(--color-text-faint)">5 sets · 4.8k lb</span>
</div>

<div style="flex:1;padding:0 28px;display:flex;flex-direction:column;justify-content:center">

<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:11px"><span class="dia"></span><span style="font-size:19px;font-weight:500">Incline DB Press</span></div>
<span style="font-size:12px;color:var(--color-text-faint)">Set 3</span>
</div>

<div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-top:24px">
<div style="display:flex;align-items:baseline;gap:5px"><span class="num on" id="w" onclick="sel('w')">60</span><span style="font-size:15px;color:var(--color-text-muted)">lb</span></div>
<span style="font-size:22px;color:var(--color-text-faint)">×</span>
<span class="num" id="r" onclick="sel('r')">10</span>
</div>

<div style="display:flex;align-items:center;justify-content:center;margin-top:14px">
<span style="font-size:13px;color:var(--color-text-muted)">RPE 8 <span style="color:var(--color-text-faint);margin:0 6px">·</span> <span id="prog" style="color:var(--color-accent)">+2 reps vs last 60×8</span></span>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-top:26px;font-size:13px;color:var(--color-text-muted)">
<i class="ti ti-clock" style="font-size:15px;color:var(--color-text-faint)"></i>
<span>Resting <span id="rt" style="color:var(--color-text)">1:04</span> <span style="color:var(--color-text-faint)">/ 2:00</span></span>
<div style="flex:1;height:2px;background:var(--color-line);border-radius:2px;position:relative;overflow:hidden"><div id="rbar" style="position:absolute;left:0;top:0;bottom:0;width:53%;background:var(--color-accent)"></div></div>
<span onclick="skip()" style="color:var(--color-text-faint);font-size:12px;cursor:pointer">Skip</span>
</div>

</div>

<div style="padding:14px 20px 0;border-top:1px solid var(--color-line)">
<div style="display:flex;justify-content:space-between;align-items:center;padding:0 8px 8px;font-size:12px;color:var(--color-text-faint)">
<span>Editing <span id="fld" style="color:var(--color-accent)">weight</span></span>
<i class="ti ti-microphone" style="font-size:18px;color:var(--color-text-muted);cursor:pointer"></i>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px">
<span class="key" onclick="dig('1')">1</span><span class="key" onclick="dig('2')">2</span><span class="key" onclick="dig('3')">3</span>
<span class="key" onclick="dig('4')">4</span><span class="key" onclick="dig('5')">5</span><span class="key" onclick="dig('6')">6</span>
<span class="key" onclick="dig('7')">7</span><span class="key" onclick="dig('8')">8</span><span class="key" onclick="dig('9')">9</span>
<span class="key" onclick="dig('.')">.</span><span class="key" onclick="dig('0')">0</span><span class="key" onclick="bks()"><i class="ti ti-backspace" style="font-size:22px;color:var(--color-text-muted)"></i></span>
</div>
<div onclick="logset()" style="margin:10px 8px 0;background:var(--color-accent);color:var(--color-accent-ink);text-align:center;padding:15px;border-radius:var(--radius-control);font-size:16px;font-weight:500;cursor:pointer">Log set</div>
</div>

<div style="display:flex;justify-content:center;padding:10px 0 9px"><div style="width:126px;height:5px;border-radius:3px;background:#2E2A25"></div></div>

</div></div>
<script>
var f='w',ws='60',rs='10',lW=60,lR=8,rest=64,tgt=120;
function fmt(s){var m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function prog(){var w=parseFloat(ws)||0,r=parseFloat(rs)||0,p=document.getElementById('prog');
if(w>lW)p.textContent='+'+Math.round(w-lW)+' lb vs last '+lW+'×'+lR;
else if(w<lW)p.textContent='vs last '+lW+'×'+lR;
else if(r>lR)p.textContent='+'+Math.round(r-lR)+' reps vs last '+lW+'×'+lR;
else if(r===lR)p.textContent='matched last '+lW+'×'+lR;
else p.textContent='vs last '+lW+'×'+lR;
p.style.color=(w>lW||r>lR)?'var(--color-accent)':'var(--color-text-muted)';}
function draw(){document.getElementById('w').textContent=ws||'0';document.getElementById('r').textContent=rs||'0';
document.getElementById('w').classList.toggle('on',f==='w');document.getElementById('r').classList.toggle('on',f==='r');
document.getElementById('fld').textContent=f==='w'?'weight':'reps';prog();}
function rb(){document.getElementById('rt').textContent=fmt(rest);document.getElementById('rbar').style.width=Math.min(100,Math.round(rest/tgt*100))+'%';}
setInterval(function(){rest++;rb();},1000);
function sel(x){f=x;draw();}
function dig(d){var v=(f==='w'?ws:rs);if(d==='.'&&v.indexOf('.')>-1)return;if(v.length>=4)return;v=(v==='0'&&d!=='.')?d:v+d;if(f==='w')ws=v;else rs=v;draw();}
function bks(){var v=(f==='w'?ws:rs).slice(0,-1);if(f==='w')ws=v;else rs=v;draw();}
function logset(){rest=0;rb();}function skip(){rest=0;rb();}
draw();rb();
</script>
</body>
</html>
